# Production MQTT broker. Requires authentication — the password file is
# generated at container startup from MQTT_USERNAME/MQTT_PASSWORD (see
# entrypoint.sh), never baked into the image. Dev connects instead to
# clawix-mqtt's broker over host.docker.internal (see docker-compose.dev.yml).
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
